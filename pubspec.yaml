name: clearskin_ai
description: "ClearSkin AI - your personal AI skin coach."
publish_to: 'none'

# versionName+versionCode. Bump the build number (after +) on every Play upload.
version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  # State & navigation
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.1

  # Backend, auth & monetization
  supabase_flutter: ^2.18.3
  purchases_flutter: ^10.18.1

  # Camera, on-device vision & scanning
  camera: ^0.12.1
  google_mlkit_face_detection: ^0.15.1
  google_mlkit_text_recognition: ^0.17.1
  mobile_scanner: ^7.4.2
  image_picker: ^1.2.4
  image: ^4.12.0

  # Local persistence
  sqflite: ^2.4.5
  path: ^1.9.1
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6

  # Networking
  http: ^1.6.0

  # UI
  cupertino_icons: ^1.0.8
  fl_chart: ^1.3.0
  flutter_animate: ^4.5.2

  # Platform services
  flutter_local_notifications: ^22.3.2
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1
  local_auth: ^3.0.2
  url_launcher: ^6.3.3
  share_plus: ^13.3.1
  in_app_review: ^2.0.12

  # Utilities
  intl: ^0.20.3
  uuid: ^4.6.0
  google_sign_in: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    # Asset folders are not recursive: list each one.
    - assets/images/photos/
    - assets/brand/

  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/PlusJakartaSans-Light.ttf
          weight: 300
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
